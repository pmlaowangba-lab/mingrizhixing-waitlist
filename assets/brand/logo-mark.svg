<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <radialGradient id="fm-glow" cx="50%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fm-whale" x1="15%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="68%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="fm-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#FF8A1E"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- 满画幅曜石方印，零多余白边 -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#fm-bg)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#fm-glow)"/>
  <!-- 头顶锐利亮橙大星 -->
  <path d="M46 8 L49.5 17.5 L59 21 L49.5 24.5 L46 34 L42.5 24.5 L33 21 L42.5 17.5 Z" fill="url(#fm-lens)"/>
  <!-- 高对比银白圆润鲸身（放大铺满，16px 下轮廓极度清晰） -->
  <path d="M10 61 C10 39 27 29 48 29 C64 29 75 38 78 51 C82 46 88 43 91 47 C93 50 91 56 86 58 C91 60 92 67 87 69 C83 71 78 67 76 64 C71 80 57 89 40 89 C21 89 10 78 10 61 Z" fill="url(#fm-whale)"/>
  <!-- 底部深色小胸鳍（强化鲸鱼辨识度） -->
  <path d="M51 67 C58 67 62.5 71.5 60 77.5 C57.8 81.8 51 79.5 48.8 74 C47.6 70.5 48.8 67 51 67 Z" fill="#0F172A"/>
  <!-- 粗黑框 + 高饱和亮橙双墨镜（小尺寸依然刀刻般清晰） -->
  <rect x="16" y="45" width="23" height="16.5" rx="5.5" fill="url(#fm-lens)" stroke="#0B1120" stroke-width="3.8"/>
  <rect x="43" y="45" width="23" height="16.5" rx="5.5" fill="url(#fm-lens)" stroke="#0B1120" stroke-width="3.8"/>
  <line x1="39" y1="52" x2="43" y2="52" stroke="#0B1120" stroke-width="4.2"/>
  <line x1="66" y1="51" x2="77" y2="47.5" stroke="#0B1120" stroke-width="3.8" stroke-linecap="round"/>
  <!-- 利落镜面高光 -->
  <polygon points="21,48 27,48 21.5,58.5 18.5,58.5" fill="#FFFFFF" fill-opacity="0.72"/>
  <polygon points="48,48 54,48 48.5,58.5 45.5,58.5" fill="#FFFFFF" fill-opacity="0.72"/>
  <!-- 酷笑弧线（深墨色在浅白鲸身上高对比） -->
  <path d="M34 67.5 Q41.5 71.5 48 66" fill="none" stroke="#0F172A" stroke-width="3.2" stroke-linecap="round"/>
</svg>
